name: Probe scsbid (temporary)
on:
  push:
    branches: [scsbid-cache]
    paths: [scripts/probe-scsbid.mjs, .github/workflows/probe-scsbid.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Probe
        env:
          DATA_PORTAL_KEY: ${{ secrets.DATA_PORTAL_KEY }}
        run: node scripts/probe-scsbid.mjs
