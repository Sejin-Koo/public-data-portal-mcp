name: Refresh scsbid cache

# 나라장터 공사·용역 낙찰정보 월별 사전수집본(data/scsbid/) 갱신.
# 공고정보·참가가능지역 원본은 저장소가 아니라 Actions 캐시(.cache/scsbid)에만 둔다.
permissions:
  contents: write

on:
  schedule:
    # 매월 2일·16일 04:17 KST (= 1일·15일 19:17 UTC). 최근 3개 창을 다시 받는다
    # (개찰→낙찰 등록 지연이 최대 수십 일이라 지난달·지지난달 창도 늘어난다).
    - cron: "17 19 1,15 * *"
    # 한 번만 쓰는 일정(2026-10-31 00:40 KST): 2차 백필 때 한도에 걸려 빠진 공사 2025-06~2025-09 창.
    # 다음 해 같은 날에 다시 돌지 않도록 수집 확인 뒤 이 줄과 아래 ONCE 분기를 지운다.
    - cron: "40 15 30 10 *"
  workflow_dispatch:
    inputs:
      mode:
        description: "refresh = 최근 N개 창 / backfill = 보존기간(25개 창) 전부"
        type: choice
        options: [refresh, backfill]
        default: refresh
      months:
        description: "refresh일 때 다시 받을 창 수 (기본 3)"
        default: "3"
      types:
        description: "업무구분 (cnstwk,servc)"
        default: "cnstwk,servc"
      skip:
        description: "백필을 나눌 때 건너뛸 최근 창 수 (예: 첫날 refresh months=12, 다음날 refresh months=13 skip=12)"
        default: "0"

concurrency:
  group: scsbid-cache
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # 백필은 원천 호출이 1,500회 안팎이라 1시간을 넘길 수 있다.
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: 데이터 받기(릴리스 첨부파일)
        run: node scripts/release-data.mjs fetch

      - name: Restore notice cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/scsbid
          key: scsbid-${{ github.run_id }}
          restore-keys: scsbid-

      # 외부 패키지를 쓰지 않는다(fetch·zlib 모두 Node 내장).
      - name: Refresh scsbid cache
        env:
          DATA_PORTAL_KEY: ${{ secrets.DATA_PORTAL_KEY }}
        run: |
          if [ -z "$DATA_PORTAL_KEY" ]; then echo "::error::DATA_PORTAL_KEY secret not set"; exit 1; fi
          MODE="${{ github.event.inputs.mode }}"
          MONTHS="${{ github.event.inputs.months }}"
          TYPES="${{ github.event.inputs.types }}"
          SKIP="${{ github.event.inputs.skip }}"
          if [ "${{ github.event.schedule }}" = "40 15 30 10 *" ]; then
            MODE=refresh; MONTHS=4; SKIP=13; TYPES=cnstwk
            echo "ONCE: 공사 202506~202509 재수집"
          fi
          if [ "$MODE" = "backfill" ]; then
            node scripts/refresh-scsbid-cache.mjs --backfill 25 --types "${TYPES:-cnstwk,servc}"
          else
            node scripts/refresh-scsbid-cache.mjs --months "${MONTHS:-3}" --skip "${SKIP:-0}" --types "${TYPES:-cnstwk,servc}"
          fi

      - name: Save notice cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .cache/scsbid
          key: scsbid-${{ github.run_id }}

      - name: 릴리스에 올리고 가리킴 커밋
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SZ=$(du -sk data/scsbid | cut -f1)
          scripts/commit-data-release.sh "chore: 나라장터 낙찰 수집본 자동 갱신 (data/scsbid ${SZ}KB, 릴리스 첨부)" prune:data/scsbid/ data/scsbid/*
