name: Refresh corp_name_index

# 자동 커밋·push에 필요한 쓰기 권한. 기본 GITHUB_TOKEN은 읽기 전용이라
# 이 선언이 없으면 push가 exit code 128로 실패한다(dart-mcp에서 실측).
permissions:
  contents: write

on:
  schedule:
    # 매주 월요일 03:00 KST (= 일요일 18:00 UTC)
    # DART 신규 등록은 하루 수십 건 수준이라 일 단위까지는 불필요하다.
    - cron: "0 18 * * 0"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --omit=dev --no-save adm-zip

      - name: Refresh corp_name_index
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: node scripts/refresh-corp-index.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/corp_name_index.json.gz; then
            echo "변경 없음 — 커밋 생략"
          else
            git add data/corp_name_index.json.gz
            git commit -m "chore: corp_name_index 자동 갱신 ($(date -u +%Y-%m-%d))"
            git push
          fi
