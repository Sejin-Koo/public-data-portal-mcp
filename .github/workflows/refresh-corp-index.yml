name: Refresh corp_name_index

# 자동 커밋·push에 필요한 쓰기 권한. 기본 GITHUB_TOKEN은 읽기 전용이라
# 이 선언이 없으면 push가 exit code 128로 실패한다(dart-mcp에서 실측).
permissions:
  contents: write

on:
  schedule:
    # 매주 월요일 03:00 KST (= 일요일 18:00 UTC)
    # DART 신규 등록은 하루 수십 건 수준이라 일 단위까지는 불필요하다.
    - cron: "0 18 * * 0"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: 데이터 받기(릴리스 첨부파일)
        run: node scripts/release-data.mjs fetch

      - name: Install dependencies
        run: npm install --omit=dev --no-save adm-zip

      - name: Refresh corp_name_index
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: node scripts/refresh-corp-index.mjs

      - name: 릴리스에 올리고 가리킴 커밋
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/commit-data-release.sh "chore: corp_name_index 자동 갱신 ($(date -u +%Y-%m-%d), 릴리스 첨부)" data/corp_name_index.json.gz
